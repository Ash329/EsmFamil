<!doctype html>
<!-- Farsi by default; lang/dir are updated by script.js when the language toggle changes -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اسم فامیل</title>
  <meta name="description" content="Esm-o-Famil (اسم فامیل), the Persian word game, on a notebook page — in English and Farsi.">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/icon-16.png">

  <!-- Kalam: English handwriting · Aref Ruqaa: Persian handwriting · Lalezar: Persian headers & stamps
       Courier Prime: stamped/typewriter chrome · Vazirmatn: Persian fallback for small UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Courier+Prime:wght@400;700&family=Kalam:wght@400;700&family=Lalezar&family=Vazirmatn:wght@400;700&display=swap">

  <link rel="stylesheet" href="/src/styles.css">
  <!-- type="module" lets Vite bundle it; modules are deferred like `defer` -->
  <script type="module" src="/src/script.js"></script>
</head>
<body>
  <!-- Shared SVG definitions: ink hatching for the timer, rubber-stamp roughness filter -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="hatch" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
        <line x1="0" y1="0" x2="0" y2="3.5" class="hatch-line"></line>
      </pattern>
      <pattern id="hatch-red" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
        <line x1="0" y1="0" x2="0" y2="3.5" class="hatch-line hatch-line-red"></line>
      </pattern>
      <!-- Uneven rubber-stamp edges -->
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"></feDisplacementMap>
      </filter>
    </defs>
  </svg>

  <div class="paper">

    <!-- ===== Top margin (unruled): title, language, the round's letter, timer ===== -->
    <header class="top-margin">
      <!-- dir="ltr": title stays left and the language switch right in both languages -->
      <div class="masthead" dir="ltr">
        <h1 class="title">
          <img class="title-icon" src="/images/icon-16.png" alt="" width="22" height="22">
          <span id="brand" dir="auto">اسم فامیل</span>
        </h1>
        <div class="lang-toggle" role="group" id="lang-group" aria-label="Language">
          <button type="button" data-lang="en" lang="en" dir="ltr" aria-pressed="false">English</button>
          <button type="button" data-lang="fa" lang="fa" dir="rtl" aria-pressed="true">فارسی</button>
        </div>
      </div>

      <div class="round-bar">
        <!-- The letter, hand-written in a hand-drawn box -->
        <div class="letter-box" id="letter-box">
          <svg class="letter-box-frame" viewBox="0 0 68 68" aria-hidden="true" focusable="false">
            <path id="letter-box-path"></path>
          </svg>
          <span class="letter" id="letter" aria-hidden="true">?</span>
        </div>

        <div class="round-meta">
          <p class="round-label" id="round-label">Round 1</p>
          <p class="hint" id="hint"></p>
        </div>

        <!-- Starts the next round: letters run for 2 s, then land on one -->
        <button type="button" class="stamp" id="new-round" hidden>New round</button>

        <div class="timer-wrap">
          <div class="timer" id="timer">
            <svg class="timer-pie" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
              <circle class="pie" id="timer-pie" cx="22" cy="22" r="8.5"></circle>
              <path class="pie-outline" id="timer-outline"></path>
            </svg>
            <span class="timer-text">
              <span class="timer-label" id="timer-label">Time left</span>
              <span class="timer-value" id="timer-value" role="timer">1:00</span>
            </span>
          </div>
          <div class="timer-settings">
            <label class="check">
              <input type="checkbox" id="timer-enabled" checked>
              <span id="timer-enabled-label">timer</span>
            </label>
            <label class="seconds">
              <input type="number" id="timer-seconds" dir="ltr" inputmode="numeric"
                     min="10" max="600" step="5" value="60" aria-label="Timer length in seconds">
              <span id="seconds-label" aria-hidden="true">sec</span>
            </label>
          </div>
        </div>
      </div>
    </header>

    <!-- ===== The ruled sheet: one row per round ===== -->
    <form class="sheet-area" id="sheet-form" novalidate autocomplete="off">
      <div class="sheet-scroll" id="sheet-scroll" tabindex="0" role="region" aria-label="Score sheet">
        <table class="sheet" id="sheet">
          <thead><tr id="head-row"></tr></thead>
          <tbody id="rows"></tbody>
          <tfoot>
            <tr class="total-row">
              <th scope="row" class="col-letter total-label" id="total-label">Total</th>
              <td class="total-spacer" id="total-spacer"></td>
              <td class="col-score"><span class="total" id="total-value">0</span></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="sheet-actions">
        <button type="submit" class="stamp stamp-tab" id="submit-btn" disabled>Submit</button>
      </div>

      <!-- "Graded" rubber stamp, thumped onto the row on submit -->
      <div class="graded-stamp" id="graded-stamp" aria-hidden="true">Graded</div>
    </form>

    <p class="sr-only" id="announcer" aria-live="polite"></p>
  </div>
</body>
</html>
